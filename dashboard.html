<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ping Monitor Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .status-card { background-color: #2d2d2d; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        .status-good { border-left: 5px solid #4caf50; }
        .status-warn { border-left: 5px solid #ff9800; }
        .status-bad { border-left: 5px solid #f44336; }
        canvas { background-color: #2d2d2d; border-radius: 8px; padding: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1 { margin: 0; font-size: 24px; }
        .metric { font-size: 14px; color: #aaa; }
        .value { font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Ping Monitor Dashboard</h1>
            <div id="connection-status" style="color: #888;">Connecting...</div>
        </div>

        <div id="status-container">
            <!-- Status cards will go here -->
        </div>

        <div style="margin-top: 20px;">
            <canvas id="latencyChart" width="400" height="150"></canvas>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('latencyChart').getContext('2d');
        const maxDataPoints = 60; // Show last 60 seconds

        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: []
            },
            options: {
                responsive: true,
                animation: false,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                scales: {
                    x: {
                        display: true,
                        title: { display: true, text: 'Time' },
                        grid: { color: '#444' }
                    },
                    y: {
                        display: true,
                        title: { display: true, text: 'Latency (ms)' },
                        min: 0,
                        grid: { color: '#444' }
                    }
                },
                plugins: {
                    legend: { labels: { color: '#e0e0e0' } }
                }
            }
        });

        const colors = [
            '#4caf50', // Green
            '#2196f3', // Blue
            '#ff9800', // Orange
            '#9c27b0', // Purple
            '#00bcd4'  // Cyan
        ];

        function updateStatus(data) {
            const container = document.getElementById('status-container');
            container.innerHTML = '';

            data.targets.forEach(target => {
                const card = document.createElement('div');
                let statusClass = 'status-good';
                if (target.last_latency > 100) statusClass = 'status-warn';
                if (target.last_latency === null || target.last_latency > 200) statusClass = 'status-bad'; // Null means timeout/loss

                card.className = `status-card ${statusClass}`;

                const latencyDisplay = target.last_latency === null ? 'TIMEOUT' : `${Math.round(target.last_latency)} ms`;
                const packetLoss = target.packet_loss.toFixed(1);

                card.innerHTML = `
                    <div>
                        <div class="value">${target.name}</div>
                        <div class="metric">${target.host}</div>
                    </div>
                    <div style="text-align: right;">
                        <div class="value">${latencyDisplay}</div>
                        <div class="metric">Loss: ${packetLoss}% | Avg: ${Math.round(target.avg_latency)}ms</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function fetchData() {
            fetch('/api/data')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('connection-status').innerText = 'Live';
                    document.getElementById('connection-status').style.color = '#4caf50';

                    updateStatus(data);

                    // Update Chart Data
                    const timestamp = new Date().toLocaleTimeString();

                    // Manage Labels
                    if (chart.data.labels.length >= maxDataPoints) {
                        chart.data.labels.shift();
                    }
                    chart.data.labels.push(timestamp);

                    // Update Datasets
                    data.targets.forEach((target, index) => {
                        let dataset = chart.data.datasets.find(ds => ds.label === target.name);

                        if (!dataset) {
                            dataset = {
                                label: target.name,
                                data: new Array(chart.data.labels.length - 1).fill(null), // Fill previous if new
                                borderColor: colors[index % colors.length],
                                backgroundColor: colors[index % colors.length] + '20',
                                borderWidth: 2,
                                tension: 0.3,
                                pointRadius: 0
                            };
                            chart.data.datasets.push(dataset);
                        }

                        if (dataset.data.length >= maxDataPoints) {
                            dataset.data.shift();
                        }
                        // If null (timeout), we can either put null (gap) or a high value.
                        // Let's put null to show gap, or maybe a high visible max?
                        // User wants to see "what happens". Gaps are good indicators of loss.
                        dataset.data.push(target.last_latency);
                    });

                    chart.update();
                })
                .catch(err => {
                    document.getElementById('connection-status').innerText = 'Disconnected';
                    document.getElementById('connection-status').style.color = '#f44336';
                    console.error('Error fetching data:', err);
                });
        }

        setInterval(fetchData, 1000);
        fetchData();
    </script>
</body>
</html>
